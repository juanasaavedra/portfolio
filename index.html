<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juana Saavedra — Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-view="archive">
    <div class="page-mask" aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"></div>
    <div class="preview-float" data-preview-float aria-hidden="true">
      <img src="" alt="" />
    </div>
    <header class="site-header" data-scroll-header>
      <div class="header-container">
        <a class="wordmark" href="index.html">Juana Saavedra</a>
        <nav class="nav-links">
          <a href="index.html" aria-current="page">Trabajos</a>
          <a href="about.html">Sobre mí</a>
          <a href="contact.html">Contacto</a>
        </nav>
        <div class="header-meta">
          <time data-current-date></time>
          <span data-work-count></span>
        </div>
      </div>
    </header>
    <main id="main" class="main-container">
      <div class="filter-bar" data-filter-bar>
        <div class="filter-chips" data-filter-chips>
          <!-- Year and role chips will be dynamically loaded here -->
        </div>
        <div class="filter-search">
          <input 
            type="search" 
            placeholder="Buscar por cliente..." 
            data-client-search 
            aria-label="Buscar por cliente"
          />
        </div>
      </div>
      <div class="archive-list" data-archive-list>
        <!-- Archive rows will be dynamically loaded here -->
      </div>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
